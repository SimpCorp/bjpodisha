<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Odisha Promise Tracker</title>

  <style>
    :root {
      --bg: #f6f3ec;
      --ink: #171717;
      --muted: #68635c;
      --line: #ded7ca;
      --card: #fffaf1;
      --dark: #101010;
      --green: #15803d;
      --green-bg: #dcfce7;
      --orange: #c2410c;
      --orange-bg: #ffedd5;
      --red: #b91c1c;
      --red-bg: #fee2e2;
      --shadow: 0 18px 45px rgba(22, 18, 12, 0.08);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background:
        radial-gradient(circle at 10% 0%, rgba(255, 153, 51, 0.16), transparent 28%),
        radial-gradient(circle at 90% 15%, rgba(19, 136, 8, 0.12), transparent 26%),
        var(--bg);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh;
    }

    .wrap {
      width: min(1180px, calc(100% - 32px));
      margin: auto;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(246, 243, 236, 0.82);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid rgba(222, 215, 202, 0.7);
    }

    .nav {
      height: 74px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      display: flex;
      gap: 12px;
      align-items: center;
      font-weight: 850;
      letter-spacing: -0.04em;
      font-size: 20px;
    }

    .mark {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background:
        linear-gradient(135deg, #ff9933 0 33%, white 33% 66%, #138808 66%);
      border: 1px solid rgba(0,0,0,0.08);
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
    }

    .navlinks {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .navlinks a {
      color: var(--muted);
      text-decoration: none;
      font-size: 14px;
      padding: 10px 14px;
      border-radius: 999px;
      transition: 0.25s ease;
    }

    .navlinks a:hover {
      color: var(--ink);
      background: rgba(255,255,255,0.55);
    }

    .hero {
      padding: 78px 0 38px;
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 34px;
      align-items: stretch;
    }

    .hero-copy {
      border: 1px solid var(--line);
      background: rgba(255, 250, 241, 0.72);
      border-radius: 34px;
      padding: clamp(28px, 5vw, 58px);
      box-shadow: var(--shadow);
      animation: rise 0.8s ease both;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 8px 13px;
      background: rgba(255,255,255,0.64);
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 22px;
    }

    .dot {
      width: 8px;
      height: 8px;
      background: var(--green);
      border-radius: 50%;
      box-shadow: 0 0 0 5px rgba(21,128,61,0.12);
    }

    h1 {
      font-size: clamp(42px, 8vw, 86px);
      line-height: 0.92;
      letter-spacing: -0.075em;
      max-width: 820px;
    }

    .hero-copy p {
      color: var(--muted);
      margin-top: 24px;
      font-size: 17px;
      line-height: 1.75;
      max-width: 680px;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 30px;
    }

    .btn {
      border: 1px solid var(--dark);
      background: var(--dark);
      color: white;
      text-decoration: none;
      padding: 13px 18px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 700;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 25px rgba(0,0,0,0.18);
    }

    .btn.secondary {
      background: transparent;
      color: var(--ink);
      border-color: var(--line);
    }

    .side-panel {
      display: grid;
      gap: 16px;
      animation: rise 1s ease both;
    }

    .countdown {
      border-radius: 34px;
      padding: 26px;
      background: #111;
      color: white;
      box-shadow: var(--shadow);
      min-height: 280px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
    }

    .countdown::before {
      content: "";
      position: absolute;
      inset: -80px -80px auto auto;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background: rgba(255,153,51,0.25);
      filter: blur(10px);
    }

    .countdown small {
      color: #bdbdbd;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-size: 12px;
    }

    .time-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      position: relative;
    }

    .time {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 20px;
      padding: 18px;
    }

    .time strong {
      display: block;
      font-size: clamp(28px, 5vw, 42px);
      letter-spacing: -0.05em;
    }

    .time span {
      color: #bdbdbd;
      font-size: 12px;
    }

    .mini-card {
      border: 1px solid var(--line);
      background: rgba(255,250,241,0.78);
      border-radius: 26px;
      padding: 24px;
      box-shadow: var(--shadow);
    }

    .mini-card span,
    .section-label {
      color: var(--muted);
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-weight: 800;
    }

    .mini-card h3 {
      margin-top: 8px;
      font-size: 28px;
      letter-spacing: -0.05em;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin: 28px 0;
    }

    .stat {
      border: 1px solid var(--line);
      background: rgba(255,250,241,0.7);
      border-radius: 24px;
      padding: 22px;
      box-shadow: var(--shadow);
    }

    .stat strong {
      display: block;
      font-size: 36px;
      letter-spacing: -0.05em;
    }

    .stat span {
      color: var(--muted);
      font-size: 13px;
    }

    section {
      padding: 36px 0;
    }

    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 20px;
      margin-bottom: 18px;
    }

    .section-head h2 {
      font-size: clamp(32px, 5vw, 52px);
      letter-spacing: -0.07em;
      line-height: 0.96;
      max-width: 720px;
    }

    .filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin: 18px 0 24px;
    }

    .chip {
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.45);
      border-radius: 999px;
      padding: 10px 13px;
      cursor: pointer;
      color: var(--muted);
      font-weight: 700;
      transition: 0.22s ease;
    }

    .chip.active,
    .chip:hover {
      background: #111;
      color: white;
      border-color: #111;
    }

    .promise-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    .promise {
      border: 1px solid var(--line);
      background: rgba(255,250,241,0.84);
      border-radius: 26px;
      padding: 22px;
      box-shadow: var(--shadow);
      transition: transform 0.25s ease, border-color 0.25s ease;
      animation: fade 0.45s ease both;
    }

    .promise:hover {
      transform: translateY(-5px);
      border-color: #b9aa95;
    }

    .promise-top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: start;
      margin-bottom: 14px;
    }

    .status {
      white-space: nowrap;
      font-size: 12px;
      font-weight: 850;
      border-radius: 999px;
      padding: 7px 10px;
    }

    .fulfilled {
      background: var(--green-bg);
      color: var(--green);
    }

    .progress {
      background: var(--orange-bg);
      color: var(--orange);
    }

    .overdue {
      background: var(--red-bg);
      color: var(--red);
    }
